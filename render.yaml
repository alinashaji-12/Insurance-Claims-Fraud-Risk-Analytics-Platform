# ClaimGuard AI — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Dashboard: New → Blueprint → connect this repo → apply.
# After first deploy, set ALLOWED_ORIGINS / NEXT_PUBLIC_API_URL if sync
# references need a one-time dashboard tweak (see docs/deploy_render.md).
#
# Do NOT swap these when setting manually:
#   ALLOWED_ORIGINS       = claimguard-web public URL  (CORS)
#   NEXT_PUBLIC_API_URL   = claimguard-api public URL  (client fetch base)
# Wrong NEXT_PUBLIC_API_URL → UI "Could not load data" / "Not Found".

services:
  - type: web
    name: claimguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      # Ephemeral on free tier — prefer Render Postgres (see docs/deploy_render.md)
      - key: DATABASE_URL
        value: sqlite:///./claimguard.db
      # Must be the frontend origin (claimguard-web), not the API URL.
      - key: ALLOWED_ORIGINS
        fromService:
          name: claimguard-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: claimguard-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Must be the API origin (claimguard-api), not the web URL.
      # Baked into the Next.js client at build time — change → clear cache & redeploy web.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: claimguard-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
