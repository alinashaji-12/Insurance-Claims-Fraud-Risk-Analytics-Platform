# Ruff config for ClaimGuard AI backend
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "B904",   # raise from in HTTPException paths
  "E501",   # line length handled primarily by black
]

[lint.per-file-ignores]
"app/seed.py" = ["B", "E501"]
"tests/*" = ["B"]
